<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Sign up form</title>
</head>
<body>
    <div class="main-container">
        <div class="logo">
            <div class="logo-img">
                <div class="transparent-background">
                    <img class="odin-logo" src="odin-logo.png" alt="Odin logo">
                    <p>ODIN</p>
                </div>
                <p class="credits">Photo by 
                    <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on 
                    <a href="https://unsplash.com/">Unsplash</a></p>
            </div>
        </div>
        <div class="sign-up">
            <p class="heading">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. 
                Tenetur minima architecto obcaecati quibusdam aspernatur? 
                Facilis eum obcaecati eos possimus sunt numquam quasi autem illum vero?
            </p>

            <form action="#" method="post">
                <p>Let's do this</p>

                <label for="user_first_name">First name</label>
                <input type="text" id="user_first_name" name="user_first_name">

                <label for="user_last_name">Last Name</label>
                <input type="text" id="user_last_name" name="user_last_name"> 

                <label for="user_email">Email</label>
                <input type="email" id="user_emal" name="user_email">

                <label for="user_phone">Phone number</label>
                <input type="tel" id="user_phone" name="user_phone">

                <label for="user_password">Password</label>
                <input type="password" id="user_password" name="user_password">

                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password">
            </form>
            <button>Create account</button>
            <p>Already have an account? <a href="">Log In</a> </p>
        </div>
    </div>
</body>
</html>
