<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Sign up form</title>
</head>
<body>
    <div class="main-container">
        <div class="logo">
            <div class="logo-img">
                <div class="transparent-background">
                    <img class="odin-logo" src="odin-logo.png" alt="Odin logo">
                    <p>ODIN</p>
                </div>
                <p class="credits">Photo by 
                    <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on 
                    <a href="https://unsplash.com/">Unsplash</a></p>
            </div>
        </div>
        <div class="sign-up">
            <div class="heading">
                <p>
                    This is not a real online service!
                    You know you need something like this in your life to help you
                    realize your deepest dreams.
                </p>
                <p>
                    Sign up <em>now</em> to get started.
                </p>
                <p>You <em>know</em> you want to.</p>
            </div>

            <form action="" method="post" id="sign-up-form">
                <p>Let's do this!</p>
                <div class="fields">
                    <div class="column">
                        <div>
                            <label for="fname">FIRST NAME</label>
                            <input type="text" id="fname" name="fname" required>
                        </div>
                        <div>
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div>
                            <label for="passwd">PASSWORD</label>
                            <input type="password" id="passwd" name="passwd" minlength="8" maxlength="20" required>
                        </div>
                    </div>
                    <div class="column">
                        <div>
                            <label for="lname">LAST NAME</label>
                            <input type="text" id="lname" name="lname" required>
                        </div>
                        <div>
                            <label for="pnumber">PHONE NUMBER</label>
                            <input type="tel" id="pnumber" name="pnumber" required>
                        </div>
                        <div>
                            <label for="repasswd">CONFIRM PASSWORD</label>
                            <input type="password" id="repasswd" name="repasswd" minlength="8" maxlength="20" required>
                        </div>
                    </div>
                </div>
            </form>

            <div class="bottom" >
                <button type="submit" form="sign-up-form">Create Account</button>
                <p>Already have an account? <a href="">Log in</a> </p>
            </div>
        </div>
    </div>
</body>
</html>
